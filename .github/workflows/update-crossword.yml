name: Actualizar crucigrama diario

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar crucigrama del día
        run: |
          TODAY=$(TZ=Europe/Madrid date +%F)
          python scrape_crucigramas.py --start "$TODAY" --end "$TODAY" --output crucigramas

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crucigramas
          git diff --cached --quiet || git commit -m "Actualizar crucigrama diario"
          git push
