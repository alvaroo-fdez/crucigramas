name: Actualizar crucigrama diario

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar crucigrama del día
        run: |
          TODAY=$(TZ=Europe/Madrid date +%F)
          DESTINATION="crucigramas/$TODAY.json"
          for attempt in {1..16}; do
            python scrape_crucigramas.py --start "$TODAY" --end "$TODAY" --output crucigramas
            if [ -f "$DESTINATION" ]; then
              echo "Crucigrama disponible: $DESTINATION"
              exit 0
            fi
            if [ "$attempt" -lt 16 ]; then
              echo "Todavia no esta publicado; reintento $((attempt + 1))/16 en 15 minutos"
              sleep 900
            fi
          done
          echo "El crucigrama de $TODAY no estuvo disponible tras 4 horas" >&2
          exit 1

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crucigramas
          git diff --cached --quiet || git commit -m "Actualizar crucigrama diario"
          git push
